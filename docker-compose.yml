services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Optional: self-hosted libSQL server (sqld)
  # Uncomment to use instead of embedded mode
  # sqld:
  #   image: ghcr.io/tursodatabase/libsql-server:latest
  #   ports:
  #     - "8081:8080"
  #   volumes:
  #     - sqld-data:/var/lib/sqld
  #   environment:
  #     - SQLD_NODE=primary

volumes:
  redis-data:
  # sqld-data: