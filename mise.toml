[tools]
go = "latest"
node = "lts"
pnpm = "latest"
"go:github.com/air-verse/air" = "latest"

[env]
_.file = ".env"

[tasks.install]
description = "Install workspace dependencies"
run = "pnpm install"

[tasks.dev]
description = "Run dev services, API, and client"
run = [
  { task = "dev:redis" },
  { task = "dev:mail" },
  { tasks = ["dev:api", "dev:client"] },
]

[tasks."dev:api"]
description = "Run Go API dev server with hot-reload"
run = ["air"]
dir = "apps/api"

[tasks."dev:redis"]
description = "Start Redis if not already running"
run = [
  "bash scripts/docker-ensure.sh my-redis redis:7-alpine 6379:6379",
  "bash -c 'until (echo > /dev/tcp/127.0.0.1/6379) >/dev/null 2>&1; do sleep 1; done'",
]

[tasks."dev:mail"]
description = "Start Mailpit if not already running (SMTP :1025, UI :8025)"
run = [
  "bash scripts/docker-ensure.sh my-mailpit axllent/mailpit 1025:1025 8025:8025",
  "bash -c 'until (echo > /dev/tcp/127.0.0.1/1025) >/dev/null 2>&1; do sleep 1; done'",
]

[tasks."dev:mail:ui"]
description = "Open Mailpit UI in browser"
run = "open http://localhost:8025"

[tasks."dev:client"]
description = "Run Vite client dev server with HMR"
run = "pnpm dev"
dir = "apps/web"

[tasks.build]
description = "Build client assets, copy them into Go embed directory, then build Go binary"
run = [
  "mise run build:client",
  "bash scripts/copy-web-assets.sh",
  "mise run build:api",
]

[tasks."build:client"]
description = "Build React/Vite client"
run = "pnpm build"
dir = "apps/web"

[tasks."build:api"]
description = "Build Go binary with embedded frontend assets"
run = "mkdir -p ../../bin && go build -o ../../bin/my ./cmd/api"
dir = "apps/api"

[tasks.test]
description = "Run all tests"
run = ["mise run test:api", "mise run test:client"]

[tasks."test:api"]
description = "Run Go tests"
run = "go test ./..."
dir = "apps/api"

[tasks."test:client"]
description = "Run frontend tests"
run = "pnpm test -- --run"
dir = "apps/web"

[tasks.lint]
description = "Run all linters"
run = ["mise run lint:api", "mise run lint:client"]

[tasks."lint:api"]
description = "Run Go lint checks"
run = "go vet ./..."
dir = "apps/api"

[tasks."lint:client"]
description = "Run frontend lint"
run = "pnpm lint"
dir = "apps/web"

[tasks.typecheck]
description = "Run frontend typecheck"
run = "pnpm typecheck"
dir = "apps/web"

[tasks.migrate]
description = "Run database migrations"
run = "go run ./cmd/migrate"
dir = "apps/api"

[tasks.seed]
description = "Insert dummy seed data (habits + transactions)"
run = "sqlite3 my_dev.db < scripts/seed_dev.sql"
dir = "apps/api"

[tasks.clean]
description = "Clean build outputs"
run = "rm -rf bin apps/web/dist apps/api/internal/platform/web/static"
